name: Refresh Competitor Matrix

on:
  schedule:
    # Каждый понедельник в 06:00 UTC = 09:00 МСК
    - cron: "0 6 * * 1"
  workflow_dispatch: {}   # ручной запуск из UI Actions

permissions:
  contents: write         # чтобы коммитить обновлённый data.json

concurrency:
  group: refresh-competitors
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml pyyaml

      - name: Run competitor refresh script
        id: refresh
        run: |
          python scripts/refresh_competitors.py \
            --data-json data.json \
            --registry sources/registry.yaml \
            --output data.json \
            --log-file /tmp/refresh.log
        continue-on-error: true

      - name: Show log
        if: always()
        run: cat /tmp/refresh.log || true

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet data.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "chore(data): weekly refresh of competitor_matrix [skip ci]"
          git push

      - name: Open issue on parser failure
        if: steps.refresh.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = `Weekly competitor refresh failed (${new Date().toISOString().slice(0,10)})`;
            const body = [
              'Автоматическое обновление competitor_matrix упало.',
              '',
              'Логи см. в шаге "Run competitor refresh script".',
              'Наиболее вероятные причины:',
              '- банк изменил структуру продуктовой страницы (сломался селектор)',
              '- антибот-защита (нужно обновить User-Agent / прокси)',
              '- сетевой таймаут',
              '',
              'Действие: обновить парсер в scripts/refresh_competitors.py.'
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['bug', 'automation']
            });
